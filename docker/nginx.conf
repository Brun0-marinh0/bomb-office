server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sem cache: depois de atualizar o build ninguém fica com a versão antiga
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # arquivos .gz gerados no build (wasm de ~35 MB vira ~9 MB) + compressão do resto
    gzip_static on;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/octet-stream text/css;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # o navegador guarda os arquivos, mas confere a cada visita (ETag) se mudaram:
    # sem mudança responde 304 e não baixa os ~12 MB de novo; depois de atualizar o
    # build, todo mundo recebe a versão nova (antes era no-store: baixava tudo sempre)
    add_header Cache-Control "no-cache" always;
    etag on;

    # arquivos .gz gerados no build (wasm de ~35 MB vira ~9 MB) + compressão do resto
    gzip_static on;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/octet-stream text/css;

    location / {
        try_files $uri $uri/ =404;
    }
}
